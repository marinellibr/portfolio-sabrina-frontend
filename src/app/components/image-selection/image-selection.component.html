<section class="image-selection">
  <div class="file-list" aria-label="Project asset files">
    <div class="file-list-header">
      <span>
        {{ currentFolderName || ("IMAGE_SELECTION.PROJECT_FILES" | translate) }}
      </span>
      <button type="button" class="refresh-button" [disabled]="loadingFiles" (click)="refreshFiles()">
        {{
          loadingFiles
            ? ("IMAGE_SELECTION.REFRESHING" | translate)
            : ("IMAGE_SELECTION.REFRESH" | translate)
        }}
      </button>
    </div>

    <p *ngIf="loadingFiles" class="status-text">
      {{ "IMAGE_SELECTION.LOADING_FILES" | translate }}
    </p>
    <p *ngIf="fileLoadError" class="status-text">
      {{ "IMAGE_SELECTION.USING_SAVED_LIST" | translate }}
    </p>

    <div *ngIf="currentPath" class="file-option folder-option">
      <button
        type="button"
        class="folder-main-option"
        aria-label="Voltar para a pasta anterior"
        (click)="goBack()"
      >
        <span class="folder-icon" aria-hidden="true">/</span>
        <span>..</span>
      </button>
    </div>

    <div *ngFor="let file of files" class="file-option" [class.folder-option]="file.type === 'dir'">
      <button
        *ngIf="file.type === 'dir'; else fileOption"
        type="button"
        class="folder-main-option"
        (click)="openFolder(file)"
      >
        <span class="folder-icon" aria-hidden="true">/</span>
        <span>{{ file.name }}</span>
      </button>

      <ng-template #fileOption>
      <label class="file-main-option">
        <input
          type="checkbox"
          [checked]="isSelected(file)"
          (change)="onToggle(file, $any($event.target).checked)"
        />
        <span>{{ file.name }}</span>
      </label>
      </ng-template>

      <label
        *ngIf="file.type === 'file' && isSelected(file)"
        class="cover-option"
        [class.visible]="isCoverSelected(file)"
      >
        <input
          type="checkbox"
          [checked]="isCoverSelected(file)"
          (change)="onCoverToggle(file, $any($event.target).checked)"
        />
        <span>{{ "IMAGE_SELECTION.COVER" | translate }}</span>
      </label>
    </div>
  </div>

  <div class="preview-panel">
    <ng-container *ngIf="selectedFiles.length; else emptyPreview">
      <figure *ngFor="let file of selectedFiles" class="preview-item">
        <figcaption>{{ file.name }}</figcaption>
        <img [src]="file.url" [alt]="file.name" />
      </figure>
    </ng-container>

    <ng-template #emptyPreview>
      <p>{{ "IMAGE_SELECTION.EMPTY_PREVIEW" | translate }}</p>
    </ng-template>
  </div>
</section>
