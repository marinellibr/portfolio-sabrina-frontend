<div class="admin-container">
  <header class="admin-header">
    <h1>Painel Admin - Gerenciar Posts</h1>
    <button (click)="logout()" class="btn-logout">Sair</button>
  </header>

  <main class="admin-content">
    <div *ngIf="success()" class="success-message">
      {{ success() }}
    </div>

    <div *ngIf="error()" class="error-message">
      {{ error() }}
    </div>

    <div *ngIf="getPostsError()" class="get-error-message">
      {{ getPostsError() }}
    </div>

    <div *ngIf="loadingPosts()" class="loading-message">
      Carregando posts...
    </div>

    <!-- Lista de Posts -->
    <div class="posts-list-section">
      <h2>Posts Criados ({{ posts().length }})</h2>

      <div class="posts-grid">
        <a routerLink="/admin/post-editor" class="post-card create-post-card" aria-label="Criar novo post">
          <span class="plus-icon"></span>
        </a>

        <article
          *ngFor="let post of posts(); let index = index"
          class="post-card"
          [class.has-image]="getPostCardImage(post, index)"
          [style.background-image]="getPostCardImage(post, index) ? 'url(' + getPostCardImage(post, index) + ')' : null"
        >
          <div class="post-card-content">
            <h3>{{ post.title }}</h3>
            <div class="post-actions">
              <button
                [routerLink]="['/post-editor', post._id]"
                class="btn-edit"
              >
                Editar
              </button>
              <button
                (click)="deletePost(post._id)"
                class="btn-delete"
                [disabled]="deletingId() === post._id"
              >
                {{ deletingId() === post._id ? "Deletando..." : "Excluir" }}
              </button>
            </div>
          </div>
        </article>
      </div>

      <div *ngIf="!loadingPosts() && posts().length === 0" class="empty-state">
        Nenhum post criado ainda.
      </div>
    </div>
  </main>
</div>
