<div class="container">
  <div class="title">
    <h1>
      {{ "PROJECTS.TITLE" | translate }}
      <img
        src="https://raw.githubusercontent.com/marinellibr/portfolio-sabrina-resources/main/images/smile.svg"
        alt="Smiley face"
      />
    </h1>

    <p>{{ "PROJECTS.SUBTITLE" | translate }}</p>
  </div>

  <div *ngIf="loading" class="loading-message">
    {{ "LOADING.PROJECTS" | translate }}
  </div>

  <ng-container *ngIf="!loading">
    <div class="gallery" #gallery (scroll)="onGalleryScroll($event)">
      <div class="card" *ngFor="let project of paginatedProjects; let i = index">
        <a
          [routerLink]="['/project', project._id]"
          (click)="onProjectClick(project)"
        >
          <img [src]="getCurrentImage(project, getProjectIndex(i))" />
          <h2 style="text-align: center">{{ getProjectTitle(project) }}</h2>
        </a>
      </div>
    </div>

    <div class="gallery-dots" *ngIf="paginatedProjects.length > 1">
      <button
        type="button"
        class="gallery-dot"
        *ngFor="let project of paginatedProjects; let i = index"
        [class.active]="i === activeGalleryIndex"
        [attr.aria-label]="'Ir para imagem ' + (i + 1)"
        [attr.aria-current]="i === activeGalleryIndex ? 'true' : null"
        (click)="scrollToGalleryItem(i, gallery)"
      ></button>
    </div>
  </ng-container>

  <nav class="pagination" *ngIf="totalPages > 1" aria-label="Paginação">
    <button
      type="button"
      class="pagination-arrow previous"
      aria-label="Página anterior"
      [disabled]="currentPage === 1"
      (click)="goToPreviousPage()"
    ></button>

    <button
      type="button"
      class="pagination-page"
      *ngFor="let page of pages"
      [class.active]="page === currentPage"
      [attr.aria-current]="page === currentPage ? 'page' : null"
      (click)="goToPage(page)"
    >
      {{ page }}
    </button>

    <button
      type="button"
      class="pagination-arrow next"
      aria-label="Próxima página"
      [disabled]="currentPage === totalPages"
      (click)="goToNextPage()"
    ></button>
  </nav>
</div>
